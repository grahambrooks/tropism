[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# The npm package should have this name
npm-package = "tropism"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Releases are triggered by hand rather than by a tag push, so this evaluation
# cannot race the hand-written pipeline in release.yml.
dispatch-releases = true
# dist claims .github/workflows/release.yml exclusively and regenerates it. This
# evaluation keeps the hand-written pipeline there and dist's copy beside it as
# release-dist.yml, so `allow-dirty` stops dist rewriting the wrong file. Adopting
# dist for real means deleting the hand-written one and dropping this key.
allow-dirty = ["ci"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
