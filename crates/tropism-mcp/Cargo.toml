[package]
name = "tropism-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "MCP server exposing tropism analysis to coding agents"

# Config for 'dist'
[package.metadata.dist]
# Whether to consider the binaries in a package for distribution (defaults true)
dist = false

[[bin]]
name = "tropism-mcp"
path = "src/main.rs"

# rmcp (the official Rust MCP SDK) and tokio are added at build-order step 6, over an
# analysis core already proven through the CLI. Declaring them now would mean an
# unused dependency in the dependency analyzer.
[dependencies]
tropism-core.workspace = true

[lints]
workspace = true
