# Issue #43's reproduction, now the positive case for `layers`: core -> cli is an
# edge from a lower layer to a higher one, and must be reported in both scopes.
schema_version = 1

[modules]
core = "core/**"
cli = "cli/**"

[[module_rules]]
id = "front-ends-over-core"
layers = ["cli", "core"]
severity = "error"
reason = "core must not depend on cli"
