[workspace]
members = ["crates/*"]
# demo/ holds deliberately-broken sample projects for scripts/demo.sh. They are
# analyzed by tropism, never built by cargo.
exclude = ["demo"]
resolver = "3"

[workspace.package]
# CalVer, committed rather than injected. It used to be permanently 0.0.0 with the
# version computed and injected at release time, which avoided a push loop — but
# `dist` is tag-driven and reads the version from here, and a committed version is
# also what `tropism --version`, every installer, and every registry report. Bump
# it with `make release`, never by hand. See design/13-build-and-release.md.
version = "2026.8.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/grahambrooks/tropism"
homepage = "https://github.com/grahambrooks/tropism"
# Tracks latest stable. It was 1.85 — the 2024 edition's minimum — but that was
# never true in practice: `ignore`, `ratatui`, and `time` all require 1.88, so
# `cargo check` refused before compiling a line and the msrv job had been red.
# A declared floor nothing is tested at is worse than an honest one.
rust-version = "1.97"

# Versions verified against crates.io on 2026-07-30. See design/08-crates.md for the
# rationale behind each choice and the ones deliberately deferred.
[workspace.dependencies]
tropism-core = { path = "crates/tropism-core" }
tropism-lang = { path = "crates/tropism-lang" }

anyhow = "1.0.104"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.4", features = ["derive"] }
ignore = "0.4.31"
globset = "0.4.19"
camino = { version = "1.2.5", features = ["serde1"] }
blake3 = "1.8.5"
# The parse stage is pure per file, which is what makes it safe to parallelise.
# Specified in design/01-architecture.md from the start; added for D4.
rayon = "1.12.0"
annotate-snippets = "0.12.16"
anstream = "1.0.0"
anstyle = "1.0.14"
ratatui = "0.30.2"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
# Verified against crates.io on 2026-08-01; see design/08-crates.md.
tree-sitter-python = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-swift = "0.7.3"
quick-xml = "0.41.0"
toml = "1.1.4"
petgraph = "0.8.3"
insta = "1.48.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
