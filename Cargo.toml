[workspace]
members = ["crates/*"]
# demo/ holds deliberately-broken sample projects for scripts/demo.sh. They are
# analyzed by gdep, never built by cargo.
exclude = ["demo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Versions verified against crates.io on 2026-07-30. See design/08-crates.md for the
# rationale behind each choice and the ones deliberately deferred.
[workspace.dependencies]
gdep-core = { path = "crates/gdep-core" }
gdep-lang = { path = "crates/gdep-lang" }

anyhow = "1.0.104"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.4", features = ["derive"] }
ignore = "0.4.31"
globset = "0.4.19"
camino = { version = "1.2.5", features = ["serde1"] }
blake3 = "1.8.5"
annotate-snippets = "0.12.16"
anstream = "1.0.0"
anstyle = "1.0.14"
ratatui = "0.30.2"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
quick-xml = "0.41.0"
toml = "1.1.4"
petgraph = "0.8.3"
insta = "1.48.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
