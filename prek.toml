# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-added-large-files" }
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  {
    id = "gitleaks",
    name = "Detect hardcoded secrets",
    description = "Detect hardcoded secrets using Gitleaks",
    entry = "gitleaks git --pre-commit --redact --staged --verbose",
    language = "golang",
    pass_filenames = false
  }
]

[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.5.0"
hooks = [
  {
    id = "betterleaks",
    name = "Detect secrets",
    entry = "betterleaks git --pre-commit --redact --staged --verbose"
  }
]

# tropism checking tropism, at the moment of commit.
#
# Two hooks, because the two scopes answer different questions and only one of
# them is fast enough to run on every commit.
#
# `tropism check <files>` is the differentiator: rules only, scoped to what
# changed, so a repository that already violates its rules still passes every
# commit that does not add a new violation. No baseline file, nothing to
# regenerate after a refactor. See design/14-incremental-checking.md.
#
# `tropism analyze` is everything, and runs on push rather than on commit. It
# carries the advisory checks — cycles, hygiene, the resolved tree — which are
# worth seeing but must never block: `unused-dep` measured 63% false positives on
# real repositories, and a hook that cries wolf is disabled permanently by the
# first developer it blocks wrongly.
#
# Both use `language = "system"` rather than prek's `language = "rust"`, which
# installs with `cargo install --bins --locked` and is refused by this
# repository's virtual manifest (D25). They run `cargo run` against the local
# workspace instead — right for a repo whose developers necessarily have cargo,
# and not a distributable arrangement. What is distributable is
# `.pre-commit-hooks.yaml`, which other repositories consume.
#
# `--format text` explicitly, not `auto`: prek captures stdout, so `auto` sees a
# non-tty and emits JSON — unreadable at the moment a developer is blocked. The
# diagnostics render the ruleset's `reason` verbatim, which is what is wanted
# then: not that a constraint was broken, but why it exists.
[[repos]]
repo = "local"
hooks = [
  {
    id = "tropism",
    name = "tropism: architecture rules on changed files",
    entry = "cargo run --quiet -p tropism -- check --format text",
    language = "system",
    # The changed files are the scope. This is the entire point.
    files = "\\.(rs|go|js|mjs|cjs|ts|tsx|py|pyi|rb|java|swift|cpp|cc|cxx|hpp|hh|hxx|h|cs)$|(^|/)(tropism\\.toml|Cargo\\.toml|go\\.mod|package\\.json|pyproject\\.toml|requirements\\.txt|Gemfile|pom\\.xml|build\\.gradle(\\.kts)?|Package\\.swift|conanfile\\.(txt|py)|vcpkg\\.json)$|\\.csproj$"
  },
  {
    id = "tropism-all",
    name = "tropism: every check over the whole repository",
    entry = "cargo run --quiet -p tropism -- analyze . --format text --fail-on error",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  }
]
